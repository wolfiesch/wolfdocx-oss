[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wolfdocx"
version = "0.1.0"
description = "Read, write, and edit Word .docx files in Python. A python-docx alternative that edits documents in place and keeps every untouched part byte-for-byte identical. Pure Python, MIT licensed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wolfgang Schoenberger" }]
dependencies = []
keywords = [
    "word",
    "docx",
    "python-docx",
    "python-docx-alternative",
    "edit-docx",
    "create-docx",
    "openxml",
    "office",
    "office-automation",
    "reporting",
    "document",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "ruff>=0.12",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://wolfdocx.com"
Repository = "https://github.com/wolfiesch/wolfdocx-oss"
Issues = "https://github.com/wolfiesch/wolfdocx-oss/issues"
Changelog = "https://github.com/wolfiesch/wolfdocx-oss/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/wolfdocx"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/PROVENANCE.md",
    "/README.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes plus the pycodestyle error groups that flag real defects. Line length is
# left to formatting, matching the configuration this code was written against.
select = ["E4", "E7", "E9", "F"]
